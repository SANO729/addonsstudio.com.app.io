<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Addon Studio IA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#07040f;--card:#130a24;--line:#3b1d6e;--p:#b44cff;--p2:#7a2cff;--t:#f1e9ff;--m:#9b8bb8;--ok:#3dffa0;--er:#ff5c8a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{height:100%}
body{margin:0;background:radial-gradient(circle at 50% -10%,#2a0f55,var(--bg) 55%) fixed;background-color:var(--bg);color:var(--t);font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100%;padding-bottom:76px}
h1,h2,h3{margin:0 0 10px}h1{font-size:24px}h2{font-size:19px}h3{font-size:15px}
.w{max-width:560px;margin:auto;padding:16px}
.logo{font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,#fff,var(--p));-webkit-background-clip:text;color:transparent}
.card{background:linear-gradient(160deg,#1a0d33,var(--card));border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 0 18px #7a2cff22}
.card.tap{cursor:pointer}.card.tap:active{transform:scale(.98)}
input,textarea,select{width:100%;background:#0b0618;color:var(--t);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;margin:6px 0}
textarea{min-height:110px;resize:vertical}.code{font:12px ui-monospace,monospace;min-height:260px}
input:focus,textarea:focus{outline:none;border-color:var(--p);box-shadow:0 0 10px #b44cff66}
label{color:var(--m);font-size:12px}
button{background:linear-gradient(90deg,var(--p2),var(--p));color:#fff;border:0;border-radius:12px;padding:12px 14px;font:600 14px inherit;font-family:inherit;box-shadow:0 0 14px #b44cff66;cursor:pointer}
button.g{background:#1d1038;border:1px solid var(--line);box-shadow:none}button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0d0719ee;border-top:1px solid var(--line);backdrop-filter:blur(8px);padding-bottom:env(safe-area-inset-bottom,0px)}
nav a{flex:1;text-align:center;padding:10px 2px;color:var(--m);font-size:11px;cursor:pointer}nav a b{display:block;font-size:20px}nav a.on{color:var(--p);text-shadow:0 0 10px var(--p)}
.log{font-size:13px;margin:4px 0;padding:6px 8px;border-radius:8px;background:#0b0618}.log.ok{color:var(--ok)}.log.er{color:var(--er)}
.f{display:flex;justify-content:space-between;padding:9px 4px;border-bottom:1px solid #2a1650;font-size:13px;cursor:pointer;word-break:break-all}
.pill{font-size:11px;color:var(--m)}img.ic{width:56px;height:56px;border-radius:12px;image-rendering:pixelated;border:1px solid var(--line)}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--p2);padding:10px 16px;border-radius:12px;z-index:9;display:none;max-width:90%}
.sp{display:inline-block;width:14px;height:14px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px}@keyframes s{to{transform:rotate(360deg)}}
</style></head><body>
<div id="toast"></div><div class="w" id="app"></div><nav id="nav" style="display:none"></nav>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={g(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('Armazenamento cheio')}}};
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e.t);e.t=setTimeout(()=>e.style.display='none',3200)}
let me=LS.g('as_me'),view='home',P=null,busy=false;
const projs=()=>LS.g('as_p_'+me)||[],saveProjs=a=>LS.s('as_p_'+me,a);
const uid=()=>crypto.randomUUID();
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
async function ai(p,tier){let s;try{s=await claude.use('sample')}catch(e){}if(!s)throw new Error('IA indisponível neste ambiente');return s.json(p,{modelTier:tier||'default',cache:false})}
const verArr=v=>{const a=String(v||'1.21.0').split('.').map(n=>parseInt(n)||0);while(a.length<3)a.push(0);return a.slice(0,3)};
/* ---------- textures / logo ---------- */
function tex(color,pat,size=16){const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d'),u=size/16;color=/^#[0-9a-f]{6}$/i.test(color)?color:'#8844ff';
x.fillStyle=color;x.fillRect(0,0,size,size);
for(let i=0;i<16;i++)for(let j=0;j<16;j++){const r=Math.random();x.fillStyle=r<.3?'#0003':r<.45?'#fff2':'#0000';x.fillRect(i*u,j*u,u,u)}
x.fillStyle='#0006';if(pat==='gem'){x.beginPath();x.moveTo(8*u,1*u);x.lineTo(14*u,8*u);x.lineTo(8*u,15*u);x.lineTo(2*u,8*u);x.fill();x.fillStyle=color;x.beginPath();x.moveTo(8*u,3*u);x.lineTo(12*u,8*u);x.lineTo(8*u,13*u);x.lineTo(4*u,8*u);x.fill()}
else if(pat==='sword'){x.fillStyle=color;for(let i=2;i<13;i++)x.fillRect(i*u,(14-i)*u,2*u,2*u);x.fillStyle='#5a3a1a';x.fillRect(2*u,12*u,3*u,3*u)}
else if(pat==='checker'){for(let i=0;i<16;i+=4)for(let j=0;j<16;j+=4)if((i+j)%8==0){x.fillStyle='#0004';x.fillRect(i*u,j*u,4*u,4*u)}}
else if(pat==='gradient'){const g=x.createLinearGradient(0,0,0,size);g.addColorStop(0,'#fff4');g.addColorStop(1,'#0007');x.fillStyle=g;x.fillRect(0,0,size,size)}
x.strokeStyle='#0008';if(pat!=='gem'&&pat!=='sword')x.strokeRect(.5,.5,size-1,size-1);return c.toDataURL('image/png')}
function logoPng(title,c1,c2){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,256,256);g.addColorStop(0,c1);g.addColorStop(1,c2);x.fillStyle=g;x.fillRect(0,0,256,256);
x.fillStyle='#0004';for(let i=0;i<256;i+=32)for(let j=0;j<256;j+=32)if((i+j)%64==0)x.fillRect(i,j,32,32);
x.strokeStyle='#fff';x.lineWidth=6;x.strokeRect(10,10,236,236);x.fillStyle='#fff';x.textAlign='center';x.shadowColor='#000';x.shadowBlur=10;
const w=String(title||'Addon').toUpperCase().split(/\s+/).slice(0,3);x.font='bold 40px sans-serif';w.forEach((t,i)=>x.fillText(t.slice(0,9),128,128+(i-(w.length-1)/2)*48+12));return c.toDataURL('image/png')}
const imgToLogo=f=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=256;c.getContext('2d').drawImage(i,0,0,256,256);res(c.toDataURL('image/png'))};i.onerror=rej;i.src=URL.createObjectURL(f)});
/* ---------- project helpers ---------- */
function manifest(p,kind){const v=verArr(p.version),n=p.name,bp=kind==='BP',m={format_version:2,header:{name:n+(bp?' BP':' RP'),description:p.desc||n,uuid:p.u[kind],version:[1,0,0],min_engine_version:v},modules:[{type:bp?'data':'resources',uuid:uid(),version:[1,0,0]}],dependencies:[{uuid:p.u[bp?'RP':'BP'],version:[1,0,0]}]};
if(bp&&p.files['BP/scripts/main.js']){m.modules.push({type:'script',language:'javascript',uuid:uid(),version:[1,0,0],entry:'scripts/main.js'});m.dependencies.push({module_name:'@minecraft/server',version:p.api||'1.16.0'})}return JSON.stringify(m,null,2)}
function ensure(p){p.u=p.u||{BP:uid(),RP:uid()};for(const k of['BP','RP']){const f=k+'/manifest.json';if(!p.files[f])p.files[f]=manifest(p,k)}
if(!p.files['RP/pack_icon.png'])p.files['RP/pack_icon.png']=logoPng(p.name,'#7a2cff','#12062b');p.files['BP/pack_icon.png']=p.files['RP/pack_icon.png']}
function setVersion(p,v){p.version=v;for(const k of['BP','RP']){try{const m=JSON.parse(p.files[k+'/manifest.json']);m.header.min_engine_version=verArr(v);p.files[k+'/manifest.json']=JSON.stringify(m,null,2)}catch(e){}}}
function save(p){const a=projs(),i=a.findIndex(x=>x.id===p.id);p.at=Date.now();i<0?a.unshift(p):a[i]=p;saveProjs(a)}
/* ---------- fixer ---------- */
async function fixAll(p,useAI){const log=[];const clean=s=>s.replace(/^\uFEFF/,'').replace(/(^|[^:"'\\])\/\/[^\n]*/g,'$1').replace(/\/\*[\s\S]*?\*\//g,'').replace(/,\s*([}\]])/g,'$1');
for(const f of Object.keys(p.files)){if(!f.endsWith('.json'))continue;const s=p.files[f];try{JSON.parse(s)}catch(e){let ok=false;try{p.files[f]=JSON.stringify(JSON.parse(clean(s)),null,2);ok=true;log.push(['ok','Corrigido (vírgulas/comentários): '+f])}catch(e2){}
if(!ok&&useAI){try{const r=await ai('Conserte este JSON de addon Minecraft Bedrock inválido. Responda SOMENTE JSON: {"json":"<texto json corrigido>"}\n'+s.slice(0,8000));JSON.parse(r.json);p.files[f]=r.json;log.push(['ok','Reparado pela IA: '+f])}catch(e3){log.push(['er','Não foi possível reparar: '+f])}}else if(!ok)log.push(['er','JSON inválido: '+f])}}
const bi=p.files['BP/manifest.json'],ri=p.files['RP/manifest.json'];if(!bi){log.push(['ok','Criado BP/manifest.json'])}if(!ri){log.push(['ok','Criado RP/manifest.json'])}
for(const k of['BP','RP']){try{const m=JSON.parse(p.files[k+'/manifest.json']);let ch=0;if(!/^[0-9a-f-]{36}$/i.test(m.header?.uuid||'')){m.header.uuid=uid();ch++}(m.modules||[]).forEach(x=>{if(!/^[0-9a-f-]{36}$/i.test(x.uuid||'')){x.uuid=uid();ch++}});if(!m.format_version){m.format_version=2;ch++}if(!m.header.min_engine_version){m.header.min_engine_version=verArr(p.version);ch++}
if(ch){p.files[k+'/manifest.json']=JSON.stringify(m,null,2);log.push(['ok',k+' manifest: '+ch+' campo(s) corrigido(s)'])}p.u=p.u||{};p.u[k]=m.header.uuid}catch(e){}}
for(const f of['RP/textures/item_texture.json','RP/textures/terrain_texture.json']){try{const j=JSON.parse(p.files[f]||'null');if(!j)continue;for(const[k,v]of Object.entries(j.texture_data||{})){let t=v.textures;t=Array.isArray(t)?t[0]:t;if(typeof t==='string'&&!p.files['RP/'+t+'.png']){p.files['RP/'+t+'.png']=tex('#8a4cff','gem');log.push(['ok','Textura ausente criada: '+t])}}}catch(e){}}
if(p.files['BP/scripts/main.js']&&!/@minecraft\/server/.test(p.files['BP/scripts/main.js']))log.push(['er','main.js não importa @minecraft/server — revise.']);
ensure(p);if(!log.length)log.push(['ok','Nenhum erro encontrado. Addon válido!']);p.log=log;return log}
/* ---------- zip I/O ---------- */
async function readZip(buf,files,base){const z=await JSZip.loadAsync(buf);const names=Object.keys(z.files).filter(n=>!z.files[n].dir&&!/__MACOSX/.test(n));
const nested=names.filter(n=>/\.(mcpack|zip|mcaddon)$/i.test(n));for(const n of nested)await readZip(await z.files[n].async('arraybuffer'),files);
const mans=names.filter(n=>/(^|\/)manifest\.json$/.test(n));
for(const mn of mans){const root=mn.slice(0,-13);let kind='BP';try{const m=JSON.parse(await z.files[mn].async('string'));if((m.modules||[]).some(x=>x.type==='resources'))kind='RP'}catch(e){}
for(const n of names.filter(n=>n.startsWith(root)&&!nested.includes(n))){const rel=n.slice(root.length);if(/\.(png|jpg|tga|ogg|wav|fsb|mp3)$/i.test(rel)){const d=await z.files[n].async('base64');files[kind+'/'+rel]='data:application/octet-stream;base64,'+d}else files[kind+'/'+rel]=await z.files[n].async('string')}}}
async function build(p,fmt){ensure(p);const n=p.name.replace(/\W+/g,'_'),z=new JSZip();const put=(z,k,v,pre)=>v.startsWith('data:')?z.file(pre+k,v.split(',')[1],{base64:true}):z.file(pre+k,v);
if(fmt==='mcpack'){const out=[];for(const k of['BP','RP']){const zz=new JSZip();for(const[f,v]of Object.entries(p.files))if(f.startsWith(k+'/'))put(zz,f.slice(3),v,'');out.push([n+'_'+k+'.mcpack',await zz.generateAsync({type:'uint8array'})])}return out}
for(const[f,v]of Object.entries(p.files))put(z,f.slice(3),v,n+'_'+f.slice(0,2)+'/');return[[n+'.'+(fmt==='zip'?'zip':'mcaddon'),await z.generateAsync({type:'uint8array'})]]}
async function dl(p,fmt,note){try{const arr=await build(p,fmt);const d=await claude.use('downloads');if(!d)return toast('Download indisponível aqui');for(const[fn,data]of arr){try{await d.save({filename:fn,data})}catch(e){if(e.code==='rejected_extension'){await d.save({filename:fn+'.zip',data});toast('Salvo como .zip — renomeie para '+fn)}else if(e.code!=='declined')throw e}}
if(note)toast('Abra o arquivo salvo e escolha Minecraft para importar');else toast('Pronto!')}catch(e){toast('Erro: '+(e.message||e.code))}}
/* ---------- AI generation ---------- */
const SYS=v=>`Você é um especialista em addons Minecraft Bedrock/PE. Versão alvo do Minecraft: ${v}. Use format_version e componentes válidos para essa versão. Scripts usam JavaScript com @minecraft/server (import { world, system } from "@minecraft/server"). Responda SOMENTE JSON: {"name":"nome curto","desc":"descrição","api":"versão estável de @minecraft/server compatível, ex 1.16.0","logo":{"c1":"#hex","c2":"#hex"},"files":{"BP/entities/x.json":"<conteúdo string>","RP/entity/x.entity.json":"...","BP/items/x.json":"...","BP/blocks/x.json":"...","BP/scripts/main.js":"...","RP/texts/en_US.lang":"...","RP/texts/pt_BR.lang":"...","RP/textures/item_texture.json":"...","RP/textures/terrain_texture.json":"..."},"textures":[{"path":"RP/textures/items/x","color":"#hex","pattern":"solid|gem|sword|checker|gradient"}]}. NÃO inclua manifest.json nem PNGs (o app cria). Use namespace próprio (ex: studio:nome). Todo item/bloco/entidade deve ter textura, nome no .lang e arquivos de RP correspondentes ao BP. Seja funcional e compacto (máx. ~10 arquivos).`;
function applyGen(p,r){Object.assign(p.files,r.files||{});p.api=r.api||p.api;p.desc=r.desc||p.desc;for(const t of r.textures||[])p.files[t.path+'.png']=tex(t.color,t.pattern);if(r.logo)p.files['RP/pack_icon.png']=logoPng(p.name,r.logo.c1||'#7a2cff',r.logo.c2||'#12062b')}
/* ---------- UI ---------- */
const NAV=[['home','🏠','Início'],['create','✨','Criar'],['import','📥','Importar'],['projects','📁','Projetos']];
function render(){if(!me)return auth();$('#nav').style.display='flex';$('#nav').innerHTML=NAV.map(([k,i,t])=>`<a class="${view===k||(view==='edit'&&k==='projects')?'on':''}" onclick="go('${k}')"><b>${i}</b>${t}</a>`).join('');({home,create,import:imp,projects,edit})[view]()}
function go(v){view=v;render();scrollTo(0,0)}
let mode='login';
function auth(){$('#nav').style.display='none';const reg=mode==='reg';app.innerHTML=`<h1 class="logo" style="font-size:30px;margin-top:30px">⬢ Addon Studio IA</h1><p style="color:var(--m)">Crie addons para Minecraft Bedrock/PE com IA. Grátis.</p><div class="card"><h2>${reg?'Criar conta':'Entrar'}</h2><input id="a_n" placeholder="Nome" autocomplete="username">${reg?'<div class="row"><input id="a_a" type="number" placeholder="Idade"><input id="a_y" type="number" placeholder="Ano de nascimento"></div>':''}<input id="a_p" type="password" placeholder="Senha" autocomplete="current-password"><button style="width:100%;margin-top:6px" onclick="doAuth()">${reg?'Registrar':'Entrar'}</button><p class="pill" style="text-align:center;cursor:pointer" onclick="mode='${reg?'login':'reg'}';auth()">${reg?'Já tenho conta':'Criar nova conta'}</p></div><p class="pill">Os dados ficam salvos só neste navegador/dispositivo.</p>`}
async function doAuth(){const n=$('#a_n').value.trim(),pw=$('#a_p').value,U=LS.g('as_users')||{};if(!n||pw.length<4)return toast('Informe nome e senha (mín. 4)');const h=await sha(pw+n);
if(mode==='reg'){const a=+$('#a_a').value,y=+$('#a_y').value;if(!a||!y)return toast('Preencha idade e ano');if(Math.abs(2026-y-a)>1)return toast('Idade e ano de nascimento não conferem');if(U[n])return toast('Nome já existe');U[n]={a,y,h};LS.s('as_users',U)}else if(!U[n]||U[n].h!==h)return toast('Nome ou senha incorretos');
me=n;LS.s('as_me',n);view='home';render()}
function home(){const a=projs();app.innerHTML=`<h1 class="logo">Olá, ${esc(me)} 👋</h1><div class="card tap" onclick="go('create')"><h2>✨ Criar Addon com IA</h2><span class="pill">Descreva e receba BP + RP completos</span></div><div class="card tap" onclick="go('import')"><h2>📥 Importar</h2><span class="pill">.mcaddon, .mcpack, .zip ou mod Java .jar</span></div><div class="card tap" onclick="go('projects')"><h2>📁 Meus Projetos (${a.length})</h2><span class="pill">Editar, duplicar, corrigir, exportar</span></div><button class="g" onclick="me=null;LS.s('as_me',null);render()">Sair</button>`}
const busyBtn=(id,t)=>{const b=$(id);b.disabled=true;b.dataset.t=b.innerHTML;b.innerHTML='<span class="sp"></span> '+t};const idle=id=>{const b=$(id);b.disabled=false;b.innerHTML=b.dataset.t};
let lg=null;
function create(){app.innerHTML=`<h2>✨ Criar Addon com IA</h2><div class="card"><label>O que você quer?</label><textarea id="c_d" placeholder="Ex: Uma espada de rubi que lança raios, um mob dragão amigável e um bloco de rubi"></textarea><label>Versão do Minecraft (qualquer uma)</label><input id="c_v" value="1.21.70" placeholder="1.19, 1.20.80, 26.51..."><label>Logo</label><div class="row"><button class="g" onclick="$('#c_f').click()">🖼 Importar imagem</button><span class="pill" id="c_l" style="align-self:center">Logo automática com IA</span></div><input type="file" id="c_f" accept="image/*" hidden onchange="pickLogo(this)"><button id="c_b" style="width:100%;margin-top:10px" onclick="gen()">🚀 Gerar addon</button></div><div id="c_o"></div>`;lg=null}
async function pickLogo(i){try{lg=await imgToLogo(i.files[0]);$('#c_l').textContent='✔ Logo própria carregada'}catch(e){toast('Imagem inválida')}}
async function gen(){const d=$('#c_d').value.trim(),v=$('#c_v').value.trim();if(d.length<5)return toast('Descreva seu addon');busyBtn('#c_b','Gerando (até 1 min)...');
try{const r=await ai(SYS(v)+'\nPedido do usuário: '+d,'complex');const p={id:uid(),name:(r.name||'Meu Addon').slice(0,32),desc:r.desc,version:v,files:{}};applyGen(p,r);ensure(p);if(lg)p.files['RP/pack_icon.png']=p.files['BP/pack_icon.png']=lg;const log=await fixAll(p,true);save(p);P=p;view='edit';render();toast('Addon criado e verificado!')}catch(e){toast('Erro: '+(e.message||e.code||'falha na IA'))}idle('#c_b')}
function imp(){app.innerHTML=`<h2>📥 Importar</h2><div class="card"><h3>Addon (.mcaddon / .mcpack / .zip)</h3><button style="width:100%" onclick="$('#i_a').click()">Escolher arquivo</button><input type="file" id="i_a" hidden accept=".mcaddon,.mcpack,.zip" onchange="impAddon(this)"></div><div class="card"><h3>☕ Mod Java (.jar) → Bedrock</h3><p class="pill">A IA analisa o mod (itens, blocos, mobs, receitas, texturas) e recria um addon nativo. Links não podem ser baixados daqui: baixe o .jar e escolha o arquivo.</p><input id="j_l" placeholder="Nome ou link do mod (opcional, ajuda a IA)"><input id="j_v" value="1.21.70" placeholder="Versão do Minecraft alvo"><button id="j_b" style="width:100%" onclick="$('#i_j').click()">Escolher .jar e converter</button><input type="file" id="i_j" hidden accept=".jar,.zip" onchange="impJar(this)"></div>`}
async function impAddon(i){const f=i.files[0];if(!f)return;try{const files={};await readZip(await f.arrayBuffer(),files);if(!Object.keys(files).length)throw new Error('Nenhum pack encontrado');const p={id:uid(),name:f.name.replace(/\.\w+$/,''),version:'1.21.70',files};try{const m=JSON.parse(files['BP/manifest.json']||files['RP/manifest.json']);p.name=m.header.name.replace(/ (BP|RP)$/,'');p.desc=m.header.description;p.version=(m.header.min_engine_version||[1,21,70]).join('.');p.u={BP:JSON.parse(files['BP/manifest.json']||'{}').header?.uuid,RP:JSON.parse(files['RP/manifest.json']||'{}').header?.uuid}}catch(e){}
p.u=p.u?.BP&&p.u?.RP?p.u:undefined;await fixAll(p,false);save(p);P=p;view='edit';render();toast('Importado!')}catch(e){toast('Erro ao importar: '+e.message)}}
async function impJar(i){const f=i.files[0];if(!f)return;busyBtn('#j_b','Convertendo (até 1 min)...');try{const z=await JSZip.loadAsync(await f.arrayBuffer()),names=Object.keys(z.files).filter(n=>!z.files[n].dir);const v=$('#j_v').value.trim()||'1.21.70';
const meta=names.find(n=>/(fabric\.mod\.json|mods\.toml|mcmod\.info|quilt\.mod\.json)$/.test(n));const mt=meta?(await z.files[meta].async('string')).slice(0,1500):'';
const lang=names.find(n=>/assets\/[^/]+\/lang\/en_us\.json$/i.test(n));const lg2=lang?(await z.files[lang].async('string')).slice(0,3000):'';
const pick=r=>names.filter(n=>r.test(n)).slice(0,40);const texs=pick(/assets\/[^/]+\/textures\/(item|block|items|blocks)\/[^/]+\.png$/),rec=pick(/data\/[^/]+\/recipes?\/[^/]+\.json$/).slice(0,15),cls=pick(/\.class$/).map(n=>n.split('/').slice(-2).join('/')).slice(0,60);
const recs=[];for(const n of rec.slice(0,8))recs.push((await z.files[n].async('string')).slice(0,400));
const files={},tmap=[];for(const n of texs){const t=n.match(/textures\/(item|items|block|blocks)\/([^/]+)\.png$/);const isI=/^item/.test(t[1]);const path='RP/textures/'+(isI?'items':'blocks')+'/'+t[2];files[path+'.png']='data:image/png;base64,'+await z.files[n].async('base64');tmap.push(path.slice(3))}
const r=await ai(SYS(v)+`\nTAREFA: converter o mod Java abaixo para um addon Bedrock NATIVO, recriando seus itens, blocos, mobs, receitas e mecânicas principais com JSON do Bedrock e scripts (não apenas renomear). Aproxime o que for tecnicamente possível e simplifique o resto. As texturas do mod JÁ foram copiadas para estes caminhos (use-os nos item_texture/terrain_texture, não liste em "textures"): ${tmap.join(', ')||'nenhuma'}.\nDica do usuário: ${$('#j_l').value}\nMetadados: ${mt}\nLang: ${lg2}\nReceitas Java: ${recs.join('\n')}\nClasses: ${cls.join(', ')}`,'complex');
const p={id:uid(),name:(r.name||f.name.replace(/\.\w+$/,'')).slice(0,32),desc:r.desc,version:v,files};applyGen(p,r);ensure(p);await fixAll(p,true);save(p);P=p;view='edit';render();toast('Mod convertido!')}catch(e){toast('Erro: '+(e.message||e.code))}idle('#j_b')}
function projects(){const a=projs();app.innerHTML=`<h2>📁 Meus Projetos</h2>`+(a.length?a.map(p=>`<div class="card tap" onclick="openP('${p.id}')"><div class="row" style="flex-wrap:nowrap;align-items:center"><img class="ic" style="flex:none;min-width:0" src="${p.files['RP/pack_icon.png']||''}"><div><h3>${esc(p.name)}</h3><span class="pill">v${esc(p.version)} · ${Object.keys(p.files).length} arquivos · ${new Date(p.at||0).toLocaleDateString()}</span></div></div></div>`).join(''):'<div class="card pill">Nenhum projeto ainda. Crie ou importe um addon!</div>')}
function openP(id){P=projs().find(p=>p.id===id);view='edit';render()}
function edit(){const p=P;if(!p)return go('projects');const fl=Object.keys(p.files).filter(f=>!f.endsWith('.png')||1).sort();
app.innerHTML=`<div class="row" style="flex-wrap:nowrap;align-items:center"><img class="ic" style="flex:none;min-width:0" id="e_i" src="${p.files['RP/pack_icon.png']}"><div><input id="e_n" value="${esc(p.name)}" onchange="P.name=this.value"><span class="pill">Versão do Minecraft</span></div></div>
<div class="card"><div class="row"><input id="e_v" value="${esc(p.version)}"><button id="e_c" onclick="convert()">🔄 Converter versão</button></div><div class="row" style="margin-top:6px"><button class="g" onclick="$('#e_f').click()">🖼 Trocar logo</button><button class="g" id="e_g" onclick="aiLogo()">🎨 Logo com IA</button></div><input type="file" id="e_f" hidden accept="image/*" onchange="newLogo(this)"></div>
<div class="card"><h3>🤖 Pedir alteração à IA</h3><textarea id="e_p" style="min-height:70px" placeholder="Ex: adicione um zumbi rubi e corrija o bloco"></textarea><button id="e_a" style="width:100%" onclick="aiEdit()">Aplicar com IA</button></div>
<div class="card"><h3>🛠 Detecção de erros</h3><button id="e_x" style="width:100%" onclick="doFix()">Verificar e corrigir automaticamente</button><div id="e_l">${(p.log||[]).map(l=>`<div class="log ${l[0]}">${l[0]==='ok'?'✔':'✖'} ${esc(l[1])}</div>`).join('')}</div></div>
<div class="card"><h3>📤 Exportar</h3><div class="row"><button onclick="ex('mcaddon')">.mcaddon</button><button onclick="ex('mcpack')">.mcpack</button><button onclick="ex('zip')">.zip</button></div><div class="row" style="margin-top:8px"><button class="g" onclick="ex('mcaddon',1)">🎮 Abrir no Minecraft</button><button class="g" onclick="ex('mcaddon',1)">📂 Gerenciador de arquivos</button></div></div>
<div class="card"><h3>Arquivos (${fl.length})</h3>${fl.map(f=>`<div class="f" onclick="openF('${encodeURIComponent(f)}')"><span>${esc(f)}</span><span>›</span></div>`).join('')}<div id="e_ed"></div></div>
<div class="row"><button onclick="save(P);toast('Salvo!')">💾 Salvar</button><button class="g" onclick="dup()">⧉ Duplicar</button><button class="g" onclick="del()">🗑 Excluir</button></div>`}
function openF(e){const f=decodeURIComponent(e),v=P.files[f],box=$('#e_ed');if(v.startsWith('data:')){box.innerHTML=`<img style="width:128px;image-rendering:pixelated;margin-top:8px" src="${v}"><p class="pill">${esc(f)} (arquivo binário)</p>`}else{box.innerHTML=`<h3 style="margin-top:12px">${esc(f)}</h3><textarea class="code" id="e_t">${esc(v)}</textarea><button onclick="P.files[decodeURIComponent('${e}')]=$('#e_t').value;save(P);toast('Arquivo salvo')">Salvar arquivo</button>`}box.scrollIntoView({behavior:'smooth'})}
const ex=async(f,n)=>{P.name=$('#e_n').value||P.name;await fixAll(P,false);save(P);dl(P,f,n)};
async function doFix(){busyBtn('#e_x','Analisando...');await fixAll(P,true);save(P);render();toast('Verificação concluída')}
async function convert(){busyBtn('#e_c','Convertendo...');try{const v=$('#e_v').value.trim(),old=P.version;setVersion(P,v);const src=Object.entries(P.files).filter(([k,x])=>!x.startsWith('data:')&&!/manifest|\.lang$/.test(k)).map(([k,x])=>'### '+k+'\n'+x).join('\n').slice(0,24000);
const r=await ai(`Adapte este addon Minecraft Bedrock da versão ${old} para a versão ${v} (format_version, componentes renomeados/removidos, APIs de script @minecraft/server). Mantenha o comportamento sempre que tecnicamente possível. Responda SOMENTE JSON: {"api":"versão @minecraft/server","files":{"caminho":"conteúdo completo, só dos arquivos que mudaram"},"notes":["o que foi adaptado ou não é possível"]}\n`+src,'complex');Object.assign(P.files,r.files||{});P.api=r.api||P.api;P.log=(r.notes||[]).map(n=>['ok','Compat: '+n]);await fixAll(P,false);save(P);render();toast('Convertido para '+v)}catch(e){toast('Erro: '+(e.message||e.code));idle('#e_c')}}
async function aiEdit(){const t=$('#e_p').value.trim();if(t.length<4)return toast('Descreva a alteração');busyBtn('#e_a','Aplicando...');try{const src=Object.entries(P.files).filter(([k,x])=>!x.startsWith('data:')&&!/manifest/.test(k)).map(([k,x])=>'### '+k+'\n'+x).join('\n').slice(0,20000);const r=await ai(SYS(P.version)+'\nAddon existente (altere/adicione só o necessário e devolva apenas arquivos novos/alterados completos):\n'+src+'\nPedido: '+t,'complex');applyGen(P,r);await fixAll(P,true);save(P);render();toast('Alteração aplicada')}catch(e){toast('Erro: '+(e.message||e.code));idle('#e_a')}}
function setLogo(d){P.files['RP/pack_icon.png']=P.files['BP/pack_icon.png']=d;save(P);render()}
async function newLogo(i){try{setLogo(await imgToLogo(i.files[0]))}catch(e){toast('Imagem inválida')}}
async function aiLogo(){busyBtn('#e_g','Criando...');try{const r=await ai(`Escolha 2 cores hex vibrantes para a logo do addon "${P.name}" (${P.desc||''}). Responda JSON {"c1":"#hex","c2":"#hex"}`,'quick');setLogo(logoPng(P.name,r.c1,r.c2))}catch(e){toast('Erro: '+(e.message||e.code));idle('#e_g')}}
function dup(){const c=JSON.parse(JSON.stringify(P));c.id=uid();c.name+=' (cópia)';c.u={BP:uid(),RP:uid()};for(const k of['BP','RP'])c.files[k+'/manifest.json']=manifest(c,k);save(c);P=c;render();toast('Duplicado')}
function del(){if(!confirm('Excluir este projeto?'))return;saveProjs(projs().filter(x=>x.id!==P.id));P=null;go('projects')}
render();
</script></body></html>
